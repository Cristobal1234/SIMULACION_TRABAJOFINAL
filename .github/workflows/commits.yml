name: Convención de commits

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revisar mensajes de commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          regex='^(feat|fix|docs)(\([a-z0-9_-]+\))?: .+'
          malos=""
          while IFS=$'\t' read -r sha asunto; do
            if ! [[ "$asunto" =~ $regex ]]; then
              echo "::warning::Commit ${sha:0:7} no sigue el formato: $asunto"
              malos+="- \`${sha:0:7}\` $asunto"$'\n'
            fi
          done < <(git log --no-merges --format='%H%x09%s' "$BASE..$HEAD")

          if [ -n "$malos" ]; then
            cuerpo="### Aviso: formato de commits"$'\n\n'
            cuerpo+="Estos commits no siguen \`tipo: descripción\` (tipos: feat, fix, docs):"$'\n\n'
            cuerpo+="$malos"$'\n'
            cuerpo+="No bloquea el merge. Para el próximo commit, ejemplo: \`feat: agrega generador de llegadas\`."
            gh pr comment "$PR" --edit-last --create-if-none --body "$cuerpo" \
              || echo "::notice::No se pudo comentar en el PR (viene de un fork); el aviso queda en este log."
          fi
